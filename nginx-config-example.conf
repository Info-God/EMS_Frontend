# ============================================
# NGINX Configuration for React SPA + Gzip
# ============================================
# Place this inside your server block or include it
# Location: /etc/nginx/sites-available/your-domain

server {
    listen 443 ssl http2;
    server_name admin.fdrpjournals.org;

    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ============================================
    # GZIP COMPRESSION - CRITICAL FIX
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;
    gzip_disable "msie6";
    gzip_comp_level 6;

    # ============================================
    # CACHING STRATEGY - IMPORTANT
    # ============================================
    # Cache busting: assets with hash in filename never change
    location ~* ^/assets/.*\.[a-z0-9]{8}\.(js|css|woff2|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # HTML files: must revalidate (check for updates)
    location ~* \.html$ {
        expires 0;
        add_header Cache-Control "public, must-revalidate, max-age=0"; 
        add_header ETag "1";
    }

    # ============================================
    # SPA ROUTING - IMPORTANT FIX
    # ============================================
    # Root path - serve index.html
    location / {
        root /var/www/ems-frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, must-revalidate";
    }

    # ============================================
    # API PROXY - Optional (if needed)
    # ============================================
    location /api/ {
        proxy_pass https://admin.fdrpjournals.org/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ============================================
    # SECURITY HEADERS
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ============================================
    # ERROR PAGES
    # ============================================
    error_page 404 /index.html; # SPA fallback
}

# ============================================
# REDIRECT HTTP to HTTPS
# ============================================
server {
    listen 80;
    server_name admin.fdrpjournals.org;
    return 301 https://$server_name$request_uri;
}
